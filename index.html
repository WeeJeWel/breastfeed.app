<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#120f10">
    <meta name="description" content="BreastFeed — a simple feeding journal for iPhone and Apple Watch.">
    <title>BreastFeed</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #120f10;
        color: #a59a9e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        grid-template-rows: 1fr auto;
        background: radial-gradient(ellipse at 50% 42%, #f069920b, transparent 65%);
      }
      main {
        display: grid;
        place-items: center;
        padding: 28px 24px;
      }
      video {
        display: block;
        height: min(78svh, 760px);
        max-width: 100%;
        aspect-ratio: 201 / 437;
        object-fit: contain;
        border: 1px solid #ffffff14;
        border-radius: 36px;
        background: #100d0e;
        box-shadow: 0 24px 80px #0006;
      }
      footer {
        padding: 0 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
        font-size: 13px;
        line-height: 1.6;
      }
      a {
        color: #ddcfd4;
        text-decoration-color: #ddcfd450;
        text-underline-offset: 3px;
      }
      a:hover { color: #f06992; }
      a:focus-visible {
        outline: 2px solid #f06992;
        outline-offset: 5px;
        border-radius: 2px;
      }
      @media (max-width: 480px) {
        main { padding: 20px 20px 24px; }
        video { border-radius: 30px; }
      }
    </style>
  </head>
  <body>
    <main>
      <video autoplay muted loop playsinline controls preload="metadata" poster="assets/poster.jpg" aria-label="BreastFeed app screencast">
        <source src="assets/screencast.mp4" type="video/mp4">
      </video>
    </main>
    <footer>Made by <a href="https://emile.nl" target="_blank" rel="noopener noreferrer">Emile Nijssen</a></footer>
    <script>
      const video = document.querySelector('video');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (reducedMotion.matches) {
        video.autoplay = false;
        video.pause();
      }
      reducedMotion.addEventListener('change', (event) => {
        if (event.matches) video.pause();
      });
    </script>
  </body>
</html>
